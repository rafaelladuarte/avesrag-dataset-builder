version: "3.9"

# ─────────────────────────────────────────────────────────────
#  Aves Brasil — Fase 2
#  Serviços: MongoDB · PostGIS · Airflow (webserver + scheduler)
# ─────────────────────────────────────────────────────────────

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ""
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  # variáveis de projeto injetadas nos DAGs
  MONGODB_URI: mongodb://mongo:27017
  POSTGRES_URI: postgresql://aves:aves@postgres:5432/aves_brasil
  IUCN_TOKEN: ${IUCN_TOKEN}
  EBIRD_TOKEN: ${EBIRD_TOKEN}
  AVONET_CSV: /opt/dados/AVONET_BirdLife.csv
  WORLDCLIM_DIR: /opt/dados/worldclim/

services:

  # ── MongoDB — documentos de espécies ──────────────────────
  mongo:
    image: mongo:7
    container_name: aves_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./dados:/opt/dados:ro
    environment:
      MONGO_INITDB_DATABASE: aves_brasil
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL + PostGIS — ocorrências espaciais ───────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aves_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/database/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro
    environment:
      POSTGRES_USER: aves
      POSTGRES_PASSWORD: aves
      POSTGRES_DB: aves_brasil
      # banco separado para o Airflow (mesmo serviço)
      POSTGRES_MULTIPLE_DATABASES: aves_brasil,airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aves"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow — inicialização do banco ──────────────────────
  airflow-init:
    image: apache/airflow:2.9.1-python3.11
    container_name: aves_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    entrypoint: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin --password admin
          --firstname Admin --lastname Admin
          --role Admin --email admin@aves.br
      "

  # ── Airflow Scheduler ─────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.9.1-python3.11
    container_name: aves_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dados:/opt/dados:ro
      - airflow_logs:/opt/airflow/logs
    command: scheduler

  # ── Airflow Webserver ─────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.9.1-python3.11
    container_name: aves_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dados:/opt/dados:ro
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongo_data:
  pg_data:
  airflow_logs:
