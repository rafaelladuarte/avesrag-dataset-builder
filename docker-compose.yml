# MongoDB local com busca vetorial ($vectorSearch) e textual ($search).
# A imagem mongodb-atlas-local traz o mongod e o mongot; roda como replica set
# de um nó, por isso a URI usa ?directConnection=true.
#
# O nome do projeto (avesrag-builder) é diferente do usado na v1
# (avesrag-dataset-builder): os volumes novos não se misturam com o volume do
# MongoDB 7.0 antigo, que fica intocado para a migração (ver README).
name: avesrag-builder

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.3.17
    container_name: avesrag-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - atlas_data:/data/db
      - atlas_config:/data/configdb
    # O processo principal da imagem ignora SIGTERM: sem isto, `docker compose
    # stop` mata o mongod com SIGKILL. O pre_stop pede o desligamento limpo.
    pre_stop:
      - command: ["mongosh", "--quiet", "--eval", "try { db.adminCommand({ shutdown: 1 }) } catch (e) {}"]
    stop_grace_period: 60s
    healthcheck:
      # mesmo teste da imagem, com intervalo menor
      test: ["CMD", "/usr/local/bin/runner", "healthcheck"]
      interval: 10s
      timeout: 30s
      start_period: 60s
      retries: 12

volumes:
  atlas_data:
  atlas_config:
