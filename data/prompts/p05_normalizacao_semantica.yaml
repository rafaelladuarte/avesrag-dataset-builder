name: "P05_Normalizacao_Semantica"
version: "2.0"
model: "gemini-3.5-flash-lite"
system_prompt: |
  Unificar sinônimos e expressões equivalentes em português.
  Você receberá dados brutos (extrativos) sobre aves em formato JSON.
  Padronize a linguagem e corrija variações lexicais sem fazer inferências.
  Distribua os termos normalizados nos campos correspondentes do schema.

  Regras de normalização:
  - "pequenos insetos" -> "invertebrados pequenos"
  - "frutinhos" -> "frutos"
  - "mata" -> "floresta"
  - "mato" -> "vegetação"
  - "bichinhos" -> "pequenos animais"

  Preencha cada campo com os termos normalizados da categoria correspondente.
  Se não houver dados para um campo, deixe a lista vazia.
